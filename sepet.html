<head>
    <meta charset="UTF-8">

</head>
<body bgcolor="#1a1a2e" text="#ffffff" link="#00f2fe" vlink="#00f2fe">

    <table width="100%" bgcolor="#0f0f1a" cellpadding="20" cellspacing="0" style="border-bottom: 3px solid #e94560;">
        <tr>
            <td width="30%">
                <font size="6" color="#e94560"><b>🕹️ PixelNostalji</b></font>
            </td>
            <td width="70%" align="right">
                <a href="index.html" style="text-decoration:none;"><font color="#cbd5e1" size="4">Ana Sayfa</font></a> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <a href="urunler.html" style="text-decoration:none;"><font color="#cbd5e1" size="4">Konsollar & Oyunlar</font></a> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <a href="sepet.html" style="text-decoration:none;"><font color="#e94560" size="4"><b>Sepetim</b></font></a> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <a href="iletisim.html" style="text-decoration:none;"><font color="#cbd5e1" size="4">İletişim</font></a>
            </td>
        </tr>
    </table>

    <br><br><br>
    <table width="60%" align="center" bgcolor="#0f0f1a" cellpadding="40" cellspacing="0" style="border: 1px solid #252538; border-radius: 16px;">
        <tr>
            <td>
                <h2><font color="#ffffff" size="6">Alışveriş Sepetiniz</font></h2>
                <br><br>
                
                <table width="100%" cellpadding="15" cellspacing="0" style="border-collapse: collapse;">
                    <thead>
                        <tr bgcolor="#1a1a2e" style="border-bottom: 2px solid #252538;">
                            <th align="left"><font color="#ffffff" size="4">Ürün Adı</font></th>
                            <th align="left"><font color="#ffffff" size="4">Fiyat</font></th>
                        </tr>
                    </thead>
                    <tbody id="cart-items">
                        </tbody>
                </table>
                
                <br><br>
                <hr color="#252538">
                <br>
                
                <table width="100%" cellpadding="0" cellspacing="0">
                    <tr>
                        <td>
                            <h3><font size="5" color="#ffffff">Toplam Tutar: <span id="cart-total" style="color:#00f2fe;">0</span> TL</font></h3>
                        </td>
                        <td align="right">
                            <button onclick="sepetiTemizle()" style="background-color:transparent; color:#ff5271; border:1px solid #ff5271; padding:10px 20px; border-radius:6px; font-weight:bold; cursor:pointer;">Sepeti Temizle 🗑️</button>
                            &nbsp;&nbsp;
                            <button onclick="siparisFormunuAc()" style="background-color:#e94560; color:white; border:none; padding:11px 22px; border-radius:6px; font-weight:bold; cursor:pointer;">Siparişi Tamamla 🚀</button>
                        </td>
                    </tr>
                </table>

                <div id="siparis-alani" style="display: none;">
                    <br><br><br>
                    <hr color="#252538">
                    <br><br>
                    <h2><font color="#ffffff" size="5">Teslimat ve Sipariş Bilgileri</font></h2>
                    <br>
                    <form id="order-form" onsubmit="return siparisiOnayla(event)">
                        <font size="3" color="#cbd5e1">Adınız Soyadınız:</font><br>
                        <input type="text" id="order-name" required style="width:100%; padding:12px; background-color:#1a1a2e; border:1px solid #252538; border-radius:6px; color:white; margin-top:5px;"><br><br>
                        
                        <font size="3" color="#cbd5e1">Telefon Numaranız:</font><br>
                        <input type="tel" id="order-phone" required style="width:100%; padding:12px; background-color:#1a1a2e; border:1px solid #252538; border-radius:6px; color:white; margin-top:5px;"><br><br>
                        
                        <font size="3" color="#cbd5e1">Teslimat Adresi:</font><br>
                        <textarea id="order-address" rows="4" required style="width:100%; padding:12px; background-color:#1a1a2e; border:1px solid #252538; border-radius:6px; color:white; margin-top:5px; font-family:sans-serif;"></textarea><br><br>
                        
                        <input type="submit" value="Siparişi Onayla ve Bitir ✔️" style="background-color:#00f2fe; color:#1a1a2e; border:none; padding:14px; width:100%; border-radius:6px; font-weight:bold; font-size:16px; cursor:pointer;">
                    </form>
                </div>

            </td>
        </tr>
    </table>

    <br><br><br>
    <table width="100%" bgcolor="#0f0f1a" cellpadding="25" cellspacing="0" style="border-top: 1px solid #1a1a2e;">
        <tr><td align="center"><font color="#64748b" size="3">&copy; 2026 PixelNostalji</font></td></tr>
    </table>

    <script src="scripts/myscript.js"></script>
</body>
</html>
