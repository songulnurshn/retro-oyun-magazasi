    <br><br><br>
    <table width="40%" align="center" bgcolor="#0f0f1a" cellpadding="40" cellspacing="0" style="border: 1px solid #252538; border-radius: 16px;">
        <tr>
            <td>
                <h2><font color="#ffffff" size="6">Bizimle İletişime Geçin</font></h2>
                <br><br>
                <form id="contact-form" onsubmit="return formuKontrolEt(event)">
                    
                    <font size="4" color="#cbd5e1">Adınız Soyadınız:</font><br>
                    <input type="text" id="name" style="width:100%; padding:12px; background-color:#1a1a2e; border:1px solid #252538; border-radius:6px; color:white; margin-top:5px;"><br><br>
                    
                    <font size="4" color="#cbd5e1">E-posta Adresiniz:</font><br>
                    <input type="email" id="email" style="width:100%; padding:12px; background-color:#1a1a2e; border:1px solid #252538; border-radius:6px; color:white; margin-top:5px;"><br><br>
                    
                    <font size="4" color="#cbd5e1">Mesajınız:</font><br>
                    <textarea id="message" rows="5" style="width:100%; padding:12px; background-color:#1a1a2e; border:1px solid #252538; border-radius:6px; color:white; margin-top:5px; font-family:sans-serif;"></textarea><br><br>
                    
                    <input type="submit" value="Mesajı Gönder ✉️" style="background-color:#e94560; color:white; border:none; padding:14px; width:100%; border-radius:6px; font-weight:bold; font-size:16px; cursor:pointer;">
                </form>
            </td>
        </tr>
    </table>
